version: "2"
run:
  concurrency: 4
  timeout: 5m
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - goconst
    - govet
    - ineffassign
    - misspell
    - staticcheck
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - goconst
  settings:
    errcheck:
      check-blank: false
formatters:
  enable:
    - goimports
